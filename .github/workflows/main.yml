name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: |
          gradle assembleDebug --console=plain > build.log 2>&1 || {
            grep -E "^e: |error:|What went wrong|Execution failed|Could not|Unresolved|Caused by" -A2 build.log | head -10 | while read l; do echo "::error::$l"; done
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: Awaaz-APK
          path: app/build/outputs/apk/debug/*.apk
